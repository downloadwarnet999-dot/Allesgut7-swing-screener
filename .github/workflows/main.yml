name: Auto Screener & Keep Alive

on:
  schedule:
    # 1. Jam 12:15 WIB (05:15 UTC) - 15 menit setelah Sesi 1 tutup
    - cron: '15 5 * * 1-5'
    # 2. Jam 17:15 WIB (10:15 UTC) - 15 menit setelah Sesi 2 tutup
    - cron: '15 10 * * 1-5'
    # 3. Jam 23:00 WIB (16:00 UTC) - Final check malam
    - cron: '0 16 * * 1-5'
  workflow_dispatch:          # Allows manual trigger

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Screener & Send Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Send test message to prove bot is alive
          curl -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=✅ Bot is ALIVE! Running screener..."
          
          # Run the actual screener
          python main.py

      - name: Keep Streamlit App Alive
        run: |
          # Ping app Streamlit v2 biar ga tidur
          curl -I https://projectbot666-v2.streamlit.app
